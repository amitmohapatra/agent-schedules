[project]
name = "agent-schedules"
version = "0.1.0"
description = "Schedules that fire agent runs on behalf of a user who is not present."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.0.53,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "structlog>=25.2",
  "croniter>=6",
  "httpx>=0.28",
  "universal-agent-contracts>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.6"]
otel = ["opentelemetry-sdk>=1.44", "opentelemetry-exporter-otlp-proto-http>=1.44",
        "opentelemetry-instrumentation-fastapi>=0.65b0"]

[project.scripts]
agent-schedules = "agent_schedules.__main__:main"

[tool.uv.sources]
universal-agent-contracts = { path = "../agent-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_schedules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# PLR2004: in a test the literal IS the assertion — "== 422" says more than a constant named
# UNPROCESSABLE would. PLC0415: conftest imports psycopg inside the probe function so that
# collection still works (and skips with a reason) on a machine without PostgreSQL.
"tests/**" = ["PLR2004", "PLC0415"]
